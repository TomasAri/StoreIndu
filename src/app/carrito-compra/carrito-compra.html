<h2 class="titulo-carrito mt-3">Carrito de compras</h2>
<ul class="list-group">
    @for (ropa of (cartList$ | async); track ropa.name) {
        <li class="list-group-item d-flex justify-content-between align-items-center">
        <span>{{ ropa.name }}</span>
        <span class="badge bg-primary rounded-pill">{{ ropa.quantity }}</span>
        </li>
    } @empty {
        <li class="list-group-item">El carrito está vacío.</li>
    }
</ul>
